<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="main">
      <section class="allElems">
        <div class="todo elem" id="0">
          <img
            src="https://images.unsplash.com/photo-1676042349618-9f8c85d76b7f?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>To Do List</h2>
        </div>
        <div class="daily elem" id="1">
          <img
            src="https://plus.unsplash.com/premium_photo-1706191097326-cd317671d1fb?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>Daily Planner</h2>
        </div>
        <div class="motivation elem" id="2">
          <img
            src="https://images.unsplash.com/photo-1556711905-4bd1b6603275?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>Motivation</h2>
        </div>
        <div class="pomo-timer elem" id="3">
          <img
            src="https://images.unsplash.com/photo-1615109323875-8f9c69f7965e?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>Pomodoro Timer</h2>
        </div>
        <div class="goals elem" id="4">
          <img
            src="https://images.unsplash.com/photo-1629721671030-a83edbb11211?q=80&w=436&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt=""
          />
          <h2>Daily Goals</h2>
        </div>
      </section>

      <section class="fullElem todo-list-fullpage">
        <button class="back-button" id="0">Back</button>
        <h2>Your Personalised Task List</h2>
        <div class="todo-container">
          <div class="addTask">
            <form>
              <input autocomplete="off" type="text" id="task-input" placeholder="Enter Task here" name="text">
              <textarea name="textarea" placeholder="Enter Details" rows="7" spellcheck="false"></textarea>
              <div id="mark-box">
                <input type="checkbox" name="checkbox" id="check">
                <label for="check">Mark as Important</label>
              </div>
              <button>Add Task</button>
            </form>
          </div>
          <div class="allTask"></div>
        </div>
      </section>

      <section class="fullElem daily-planner-fullpage">
        <button class="back-button" id="1">Back</button>
        <h2>Plan your Day to be more productive</h2>

        <div class="day-planner">
          <div class="day-planner-time">
            <p>6:20</p>
            <input type="text" placeholder="...">
          </div>
          <div class="day-planner-time">
            <p>6:20</p>
            <input type="text" placeholder="...">
          </div>
        </div>
      </section>

      <section class="fullElem motivational-fullpage">
        <button class="back-button" id="2">Back</button>
        <h1>Motivation</h1>
      </section>

      <section class="fullElem pomodoro-fullpage">
        <button class="back-button" id="3">Back</button>
        <h1>Pomodoro Timer</h1>
      </section>

      <section class="fullElem daily-goals-fullpage">
        <button class="back-button" id="4">Back</button>
        <h1>Daily Goals</h1>
      </section>

    </div>
    <script src="script.js"></script>
  </body>
</html>
